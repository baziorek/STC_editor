name: Build STC_editor for Linux (AppImage format) [on push to any branch and release]

on:
  push:
    branches:
      - '**'   # every branch (tags are covered by the `release` event)
  release:
    types: [created]

# A newer push to the same branch/PR cancels the build still running for it (saves runner minutes).
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    # softprops/action-gh-release needs to write release assets on `release` events.
    # Declared at job level (not top level) so the token stays as narrow as possible.
    permissions:
      contents: write

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install dependencies (Qt6 + build tools)
        run: |
          sudo apt update
          sudo apt install -y \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            libqt6webenginecore6-bin \
            libgl-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            mesa-common-dev \
            build-essential \
            cmake \
            qt6-base-dev-tools \
            libuchardet-dev \
            libgtest-dev \
            libfuse2 \
            nsight-compute \
            libgconf-2-4 \
            wget

      - name: Install GCC 13 required for <format> library
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          sudo apt install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 \
                                   --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: Prepare icon
        run: |
          mkdir -p resources/icons
          cp resources/icon.png resources/icons/stc_editor.png

      - name: Create .desktop file
        run: |
          echo "[Desktop Entry]
          Name=STC Editor
          Exec=STC_editor
          Icon=stc_editor
          Type=Application
          Categories=Utility;TextEditor;" > STC_editor.desktop

      - name: Build application (CMake + Qt6)
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_PREFIX_PATH=/usr/lib/qt6 ..
          cmake --build . --parallel

      - name: Manually copy QtWebEngineProcess and resources
        run: |
          mkdir -p build/libexec
          mkdir -p build/resources
          mkdir -p build/translations

          cp qt-runtime/resources/* build/resources/
          cp -r qt-runtime/translations build/
          cp -r dictionaries build/   # the program looks for dictionaries/pl/ next to the executable

          echo "Searching for QtWebEngineProcess..."
          QTWEBENGINE_BIN=$(dpkg -L libqt6webenginecore6-bin | grep QtWebEngineProcess | head -n 1 || true)

          if [ -z "$QTWEBENGINE_BIN" ]; then
            echo "ERROR: QtWebEngineProcess not found via dpkg -L"
            exit 1
          fi

          echo "Found QtWebEngineProcess at: $QTWEBENGINE_BIN"
          cp "$QTWEBENGINE_BIN" build/libexec/

      - name: Move desktop and icon into build dir
        run: |
          cp STC_editor.desktop build/
          cp resources/icons/stc_editor.png build/

      - name: Download linuxdeployqt
        run: |
          # Pinned to release 11; the SHA-256 is verified so a tampered or
          # silently rebuilt binary cannot be executed on the runner.
          wget https://github.com/probonopd/linuxdeployqt/releases/download/11/linuxdeployqt-continuous-x86_64.AppImage
          echo "65192b29bee5f8da8820672aeee91f217896b08ca6236c84d996813129fb3510  linuxdeployqt-continuous-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Run linuxdeployqt
        run: |
          export PATH=/usr/lib/qt6/bin:$PATH
          ./linuxdeployqt-continuous-x86_64.AppImage build/STC_editor.desktop -appimage

      - name: Rename AppImage
        run: |
          APPIMAGE=$(ls *.AppImage | head -n 1)
          mv "$APPIMAGE" STC_editor-x86_64.AppImage

      - name: Build .deb package
        run: |
          mkdir -p deb/usr/bin
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps

          cp build/STC_editor deb/usr/bin/STC_editor
          chmod +x deb/usr/bin/STC_editor

          cp STC_editor.desktop deb/usr/share/applications/

          mkdir -p deb/usr/share/STC_editor/dictionaries/pl
          cp dictionaries/pl/pl_PL.aff dictionaries/pl/pl_PL.dic deb/usr/share/STC_editor/dictionaries/pl/
          cp resources/icons/stc_editor.png deb/usr/share/icons/hicolor/256x256/apps/stc_editor.png

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          else
            VERSION="0.0.1+git"
          fi

          printf "%s\n" "Package: stc-editor" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Baziorek <baziorek@find-me-on-github.pl>" \
            "Description: STC Editor - edytor znaczników STC na potrzeby cpp0x.pl" \
            > deb/DEBIAN/control

          dpkg-deb --build deb stc-editor.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STC_editor-AppImage
          path: STC_editor-x86_64.AppImage

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STC_editor-deb
          path: stc-editor.deb

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: STC_editor-x86_64.AppImage

      - name: Upload .deb to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: stc-editor.deb
