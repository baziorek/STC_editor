name: Build STC_editor for Windows (zip format) [on push to any branch and release]

on:
  push:
    branches:
      - '**'   # every branch (tags are covered by the `release` event)
  release:
    types: [created]

# softprops/action-gh-release needs to write release assets on `release` events.
permissions:
  contents: write

# A newer push to the same branch/PR cancels the build still running for it (saves runner minutes).
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Qt
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: 6.7.3
          target: desktop
          arch: win64_msvc2019_64
          modules: qtwebengine qtpositioning qtwebchannel

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Run vcpkg (manifest mode)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: vcpkg.json
          vcpkgConfigurationJsonGlob: vcpkg-configuration.json

      # - name: Configure and build (CMake + NMake)
      #   uses: lukka/run-cmake@v3
      #   with:
      #     useVcpkgToolchainFile: true
      #     cmakeBuildType: Release
      #     cmakeGenerator: "NMake Makefiles"
      #     cmakeArguments: "-DCMAKE_PREFIX_PATH=%Qt6_DIR%"
      - name: Configure and build manually
        env:
          VCPKG_MANIFEST_INSTALL: "ON"
        run: |
          mkdir build
          cd build
          cmake .. -G "NMake Makefiles" -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" -DCMAKE_BUILD_TYPE=Release
          nmake

      - name: Deploy Qt dependencies using windeployqt
        run: |
          windeployqt.exe build\STC_editor.exe --qmldir=. --no-compiler-runtime --verbose=2

      - name: Package as zip
        run: |
          mkdir zipdir
          copy build\STC_editor.exe zipdir\
          copy build\*.dll zipdir\
          copy build\*.pak zipdir\
          if (Test-Path build\QtWebEngineProcess.exe) { copy build\QtWebEngineProcess.exe zipdir\ }
          if (Test-Path build\icudtl.dat) { copy build\icudtl.dat zipdir\ }
          if (Test-Path build\resources) { Copy-Item build\resources -Recurse -Destination zipdir\ }
          if (Test-Path build\translations) { Copy-Item build\translations -Recurse -Destination zipdir\ }
          Copy-Item dictionaries -Recurse -Destination zipdir\
          if (Test-Path build\platforms) { Copy-Item build\platforms -Recurse -Destination zipdir\ }
          7z a STC_editor-win64.zip .\zipdir\*

      - name: Upload zip as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STC_editor-win64
          path: STC_editor-win64.zip

      - name: Upload ZIP to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: STC_editor-win64.zip
